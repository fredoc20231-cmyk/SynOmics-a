          python tests/chrono_tools_smoke.py

      - name: Growth dynamics gate (logistic / Gompertz / Lotka-Volterra + bundle)
        run: |
          python -m pip install --quiet numpy scipy matplotlib
          python tests/growth_dynamics_smoke.py

      - name: Genomic prediction gate (GBLUP/ridge accuracy signal-vs-noise + bundle)
        run: |
          python -m pip install --quiet numpy scikit-learn matplotlib
          python tests/genomic_prediction_smoke.py

      - name: RNA-seq pipeline gate (DESeq2-style DE recovers spike-in truth + figures/tables/article + honest upstream plan)
        run: |
          python -m pip install --quiet numpy scipy statsmodels matplotlib python-docx
          python tests/rnaseq_pipeline_smoke.py

      - name: Epitranscriptomics gate (m6A DRACH consensus motif scan, deterministic)
        run: |
          python -m pip install --quiet matplotlib
          python tests/epitranscriptomics_smoke.py

      - name: RNA velocity gate (steady-state gamma recovery + embedding projection)
        run: |
          python -m pip install --quiet numpy scipy matplotlib
          python tests/rna_velocity_smoke.py

      - name: Spatial deconvolution gate (NNLS mixture recovery + OT cell→spot mapping)
        run: |
          python -m pip install --quiet numpy scipy pot matplotlib
          python tests/spatial_deconvolution_smoke.py

      - name: Trajectory gate (diffusion + MST pseudotime recover cell order)
        run: |
          python -m pip install --quiet numpy scipy
          python tests/trajectory_smoke.py

      - name: GRN inference gate (GENIE3 regulator recovery + ARACNe DPI pruning)
        run: |
          python -m pip install --quiet numpy scikit-learn
          python tests/grn_inference_smoke.py

      - name: Multi-omics integration gate (SNF ARI=1 + CCA + joint NMF)
        run: |
          python -m pip install --quiet numpy scipy scikit-learn
          python tests/multiomics_integration_smoke.py

      - name: Mendelian randomization gate (IVW recovers causal effect + Egger detects pleiotropy)
        run: |
          python -m pip install --quiet numpy scipy
