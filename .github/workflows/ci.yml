name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install npm dependencies
        run: npm install

      - name: Type-check (tsc --noEmit, catches ToolParam/registry type errors)
        run: npm run lint

      - name: Type-check + build (frontend + server bundle)
        run: npm run build

      - name: Server integration test (boots dist/server.mjs; real HTTP stack)
        run: npx tsx tests/server_integration.ts

      - name: Ruff lint gate (Python correctness rules)
        run: |
          python -m pip install --quiet ruff
          ruff check server tests

      - name: Compile Python engines
        run: python -m py_compile server/synomics_engine.py server/biomni_engine.py server/bioOmni_engine.py

      - name: Engine smoke tests (real computation, no network)
        run: |
          set -e
          echo '{"seq1":"MKTAYIAKQR","seq2":"MKTAYIAKQC","method":"needleman_wunsch","seq_type":"protein"}' \
            | python server/synomics_engine.py align_sequences | python -c "import sys,json; d=json.load(sys.stdin); assert d['alignmentLength']>0; print('align OK', d['identityPct'])"
          echo '{"counts":{"A":[10,11,12,50,52,55],"B":[100,98,101,20,22,19]},"conditions":["control","control","control","treated","treated","treated"]}' \
            | python server/synomics_engine.py deseq2 | python -c "import sys,json; d=json.load(sys.stdin)['differentialExpression']; assert any(r['isSignificant'] for r in d); print('deseq2 OK')"
          echo '{"trait":"T","summaryStats":[{"rsid":"rs1","chr":"1","pos":1,"pvalue":1e-20},{"rsid":"rs2","chr":"2","pos":2,"pvalue":0.5}]}' \
            | python server/synomics_engine.py gwas | python -c "import sys,json; d=json.load(sys.stdin); assert d['significantHits']==1; print('gwas OK', d['genomicInflationLambda'])"
          echo '{"samples":[{"sampleId":"H1","group":"H","abundances":{"a":50,"b":30,"c":2}},{"sampleId":"D1","group":"D","abundances":{"a":5,"b":20,"c":60}}]}' \
            | python server/synomics_engine.py microbiome | python -c "import sys,json; d=json.load(sys.stdin); assert d['sampleCount']==2; print('microbiome OK')"

      - name: Engine test suite (real computation, no network)
        run: python tests/engine_smoke.py

      - name: Agent tool-use loop test suite (real execution, no network)
        run: npx tsx tests/agent_smoke.ts

      - name: Skills System test suite (curated workflows chain real tools end-to-end)
        run: |
          python -m pip install --quiet numpy scipy statsmodels biopython
          npx tsx tests/skills_smoke.ts

      - name: External-DB clients test suite (normalizers + honest-failure path)
        run: npx tsx tests/external_db_smoke.ts

      - name: Audit trail / provenance test suite
        run: npx tsx tests/audit_smoke.ts

      - name: Production hardening test suite (headers, rate limit, metrics, 404/errors)
        run: npx tsx tests/production_smoke.ts

      - name: Sandbox isolation test suite (Module C: rlimits, env-strip, kill bombs)
        run: python tests/sandbox_smoke.py

      - name: H5AD profiling gate (Module A: real AnnData structure + HALT-on-ambiguity)
        run: |
          python -m pip install --quiet h5py numpy
          python tests/h5ad_smoke.py

      - name: Advanced expression gate (NB DE, GSEA, batch correction, PCA)
        run: |
          python -m pip install --quiet numpy scipy scikit-learn statsmodels gseapy
          python tests/expression_advanced_smoke.py

      - name: Biostatistics gate (Fisher/chi2/ANOVA/corr/FDR/power/normality/ROC/logrank/Cox)
        run: |
          python -m pip install --quiet numpy scipy scikit-learn statsmodels
          python tests/biostats_smoke.py

      - name: Sequence tools gate (translate/revcomp/GC/ORF/Tm/restriction/protein/codon)
        run: |
          python -m pip install --quiet biopython
          python tests/seqtools_smoke.py

      - name: Network biology gate (centrality/community/paths/stats/RWR)
        run: |
          python -m pip install --quiet networkx numpy
          python tests/netbio_smoke.py

      - name: Cheminformatics gate (Tanimoto/similarity/substructure/Murcko/PAINS)
        run: |
          python -m pip install --quiet rdkit
          python tests/cheminfo_advanced_smoke.py

      - name: ML analysis gate (kmeans/hierarchical/tSNE/RF/LASSO/logistic)
        run: |
          python -m pip install --quiet numpy scikit-learn
          python tests/ml_analysis_smoke.py

      - name: Variant / population-genetics gate (HWE/allele freq/TsTv/VCF summary)
        run: |
          python -m pip install --quiet scipy
          python tests/variant_tools_smoke.py

      - name: Advanced microbiome gate (Chao1/CLR differential abundance/rarefaction)
        run: |
          python -m pip install --quiet numpy scipy statsmodels
          python tests/microbiome_advanced_smoke.py

      - name: Structural biology gate (summary/Rg/contact map/distance)
        run: |
          python -m pip install --quiet biopython numpy
          python tests/structure_tools_smoke.py

      - name: Dose-response gate (4-parameter logistic IC50 + AUC)
        run: |
          python -m pip install --quiet scipy numpy
          python tests/doseresponse_smoke.py

      - name: Regression gate (OLS/logistic/Poisson/mixed/robust)
        run: |
          python -m pip install --quiet numpy scipy statsmodels pandas
          python tests/regression_tools_smoke.py

      - name: Dimensionality reduction gate (MDS/ICA/NMF/FA/kernel-PCA)
        run: |
          python -m pip install --quiet numpy scikit-learn
          python tests/dimreduction_tools_smoke.py

      - name: Population genetics gate (pi/Tajima's D/Fst/LD/MAF)
        run: |
          python -m pip install --quiet numpy
          python tests/population_genetics_smoke.py

      - name: Enrichment gate (hypergeometric ORA + gene-set overlap)
        run: |
          python -m pip install --quiet numpy scipy statsmodels
          python tests/enrichment_tools_smoke.py

      - name: QC gate (FASTQ quality / count-matrix QC / MAD outliers)
        run: |
          python -m pip install --quiet numpy
          python tests/qc_tools_smoke.py

      - name: Proteomics gate (peptide mass / tryptic digest / fragment ions)
        run: python tests/proteomics_tools_smoke.py

      - name: Phylogenetics gate (distance matrix / NJ / UPGMA / patristic)
        run: |
          python -m pip install --quiet biopython numpy
          python tests/phylo_tools_smoke.py

      - name: Alignment gate (global / local / % identity / k-mer)
        run: |
          python -m pip install --quiet biopython
          python tests/align_tools_smoke.py

      - name: Epigenomics gate (interval Jaccard / PWM / M-values / DMR)
        run: |
          python -m pip install --quiet numpy scipy statsmodels
          python tests/epigenomics_smoke.py

      - name: Immunoinformatics gate (diversity / VJ usage / spectratype / overlap)
        run: python tests/immunoinformatics_smoke.py

      - name: Scientific concordance gate (engine stats vs scipy/statsmodels)
        run: |
          python -m pip install --quiet numpy scipy statsmodels
          python tests/scientific_validation.py

      - name: Causal discovery gate (DirectLiNGAM recovers known DAG)
        run: python tests/causal_smoke.py

      - name: MML model-selection gate (parsimony)
        run: python tests/mml_smoke.py

      - name: PDE residual gate (reaction-diffusion physics validity)
        run: python tests/pde_smoke.py

      - name: Tensor-Train compression gate (error-bounded, honest approximate flag)
        run: |
          python -m pip install --quiet tensorly
          python tests/tensor_smoke.py

      - name: Neuro-symbolic gate (partial-correlation edges + Z3 formal pathway proof)
        run: |
          python -m pip install --quiet scikit-learn z3-solver
          python tests/neuro_symbolic_smoke.py

      - name: Enhanced adversary gate (classifier overfit + confounder check)
        run: python tests/adversary_ml_smoke.py

      - name: Adversarial swarm gate (ensemble falsification, FDR<0.01)
        run: python tests/swarm_smoke.py

      - name: Circuit verification gate (Gillespie SSA + temporal property)
        run: python tests/circuit_smoke.py

      - name: Report generator gate (HTML + DOCX + PDF from real content)
        run: |
          python -m pip install --quiet jinja2 python-docx reportlab
          python tests/report_smoke.py

      - name: Provenance manifest gate (SHA-256 inputs/scripts/outputs)
        run: python tests/provenance_smoke.py

      - name: Robotics gate (Opentrons protocol + physical validation)
        run: python tests/robotics_smoke.py

      - name: Vision + Bayesian gate (OpenCV assay quantification + conjugate update)
        run: |
          python -m pip install --quiet opencv-python-headless
          python tests/vision_assay_smoke.py

      - name: Drug descriptors gate (real RDKit cheminformatics)
        run: |
          python -m pip install --quiet rdkit
          python tests/drug_descriptors_smoke.py

      - name: iDiscover — Optimal Transport cellular reversion (exact Wasserstein)
        run: |
          python -m pip install --quiet pot
          python tests/optimal_transport_smoke.py

      - name: iDiscover — GFlowNet molecular sampling (RDKit-valid, real reward)
        run: |
          python -m pip install --quiet rdkit
          python tests/gflownet_smoke.py

      - name: iDiscover — Hyper-NOTEARS hypergraph causal discovery (exact acyclicity gate)
        run: |
          python -m pip install --quiet numpy scipy
          python tests/test_hyper_causal.py

      - name: iDiscover — Federated ZKP biomarker discovery (log-rank + Pedersen/Schnorr, stdlib)
        run: python tests/federated_zkp_smoke.py

      - name: Self-optimizing compilation gate (Cython speedup, correctness-guarded)
        run: |
          python -m pip install --quiet cython
          python tests/accelerate_smoke.py

      - name: Time-series / signal gate (ACF/CCF/CUSUM/FFT/LOWESS/detrend/MA)
        run: |
          python -m pip install --quiet numpy scipy statsmodels
          python tests/timeseries_tools_smoke.py

      - name: Clinical epidemiology gate (OR/RR/NNT/diagnostic metrics/meta-analysis)
        run: |
          python -m pip install --quiet numpy scipy
          python tests/clinical_tools_smoke.py

      - name: WGCNA gate (soft-threshold/co-expression modules/module eigengenes)
        run: |
          python -m pip install --quiet numpy scipy scikit-learn
          python tests/wgcna_smoke.py

      - name: Flow cytometry gate (arcsinh/compensation/gating/channel summary)
        run: |
          python -m pip install --quiet numpy
          python tests/flow_tools_smoke.py

      - name: Spatial statistics gate (Moran's I / Geary's C / Getis-Ord G / Ripley's K)
        run: |
          python -m pip install --quiet numpy scipy
          python tests/spatial_tools_smoke.py

      - name: PK/PD & enzyme kinetics gate (NCA / 1-compartment / Michaelis-Menten / Ki)
