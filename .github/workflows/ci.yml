      - name: Power / sample-size gate (means / proportions / ANOVA / correlation)
        run: |
          python -m pip install --quiet numpy scipy statsmodels
          python tests/power_tools_smoke.py

      - name: Genomic interval arithmetic gate (merge / intersect / subtract / coverage / nearest)
        run: python tests/genome_intervals_smoke.py

      - name: Outcome bundle gate (Biomni-style figures/tables/code/report/docs writer)
        run: |
          python -m pip install --quiet matplotlib
          python tests/outcome_bundle_smoke.py

      - name: Glycoengineering gate (N/O-glycosylation motifs + outcome bundle)
        run: |
          python -m pip install --quiet numpy matplotlib
          python tests/glyco_tools_smoke.py

      - name: Codon optimization gate (host CAI before/after + bundle)
        run: |
          python -m pip install --quiet numpy matplotlib
